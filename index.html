<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeRPG Craft Kalkulátor & Számláló</title>
    <style>
        :root {
            --bg-main: #111318;
            --bg-card: #181a20;
            --bg-card-hover: #1f222b;
            --bg-input: #111318;
            --accent: #f7ca44;
            --accent-hover: #f8d35f;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border: #262933;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 2px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background-color: var(--accent);
            color: #000;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(247, 202, 68, 0.2);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .main-container {
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 24px;
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 950px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            height: fit-content;
        }

        .sidebar-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 12px 0 8px 8px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
        }

        .nav-item:hover {
            background-color: var(--bg-card-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(247, 202, 68, 0.25);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .recipe-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .recipe-icon-large {
            width: 60px;
            height: 60px;
            background: #121418;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .recipe-icon-large svg {
            width: 36px;
            height: 36px;
            fill: var(--accent);
        }

        .recipe-info h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .recipe-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .item-card {
            background-color: #121418;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
            transition: border-color 0.2s;
        }

        .item-card:hover {
            border-color: #383d4e;
        }

        .item-icon {
            width: 42px;
            height: 42px;
            background: #1a1d24;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            border: 1px solid var(--border);
        }

        .item-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--accent);
        }

        .item-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }

        .item-req-count {
            font-size: 0.75rem;
            color: var(--accent);
            background: rgba(247, 202, 68, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .counter-controls {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
            margin-top: 4px;
        }

        .counter-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 30px;
            height: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .counter-btn:hover {
            background: var(--border);
        }

        .counter-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            text-align: center;
            width: 100%;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .counter-input::-webkit-outer-spin-button,
        .counter-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .quick-add-bar {
            display: flex;
            gap: 4px;
            width: 100%;
            margin-top: 2px;
        }

        .quick-btn {
            background: #1f232d;
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 0;
            flex: 1;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .quick-btn:hover {
            background: #2a2f3d;
        }

        .craftable-summary {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .craftable-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }

        .craftable-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121418;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .craftable-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .craftable-info svg {
            width: 28px;
            height: 28px;
            fill: var(--accent);
        }

        .craftable-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .craft-action-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .craftable-count {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 800;
        }

        .craft-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s, transform 0.1s;
        }

        .craft-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .craft-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .craft-btn:disabled {
            background-color: #222630;
            color: #52596d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span class="logo-badge">SeeRPG</span>
            <h1>Craft Számláló & Kalkulátor</h1>
        </div>
    </header>

    <div class="main-container">
        <!-- Bal oldali menü -->
        <div class="sidebar">
            <div class="sidebar-section-title">Fegyverek</div>
            <div class="nav-list" id="nav-weapons"></div>

            <div class="sidebar-section-title" style="margin-top: 16px;">Drogok & Egyéb</div>
            <div class="nav-list" id="nav-drugs"></div>
        </div>

        <!-- Jobb oldali tartalom -->
        <div class="content-area">
            <div class="card" id="recipe-view"></div>

            <!-- Craftolható összesítő -->
            <div class="craftable-summary">
                <div class="section-title">Craftolható tárgyak</div>
                <div class="craftable-list" id="craftable-list"></div>
            </div>
        </div>
    </div>

    <script>
        const icons = {
            weapon: '<svg viewBox="0 0 24 24"><path d="M2,10V14H6V10H2M7,9H11V15H7V9M12,11H22V13H12V11Z"/></svg>',
            drug: '<svg viewBox="0 0 24 24"><path d="M6,2H18V4H6V2M6,20H18V22H6V20M7,6H17V18H7V6Z"/></svg>',
            hammer: '<svg viewBox="0 0 24 24"><path d="M21,3.5L19.5,2L14,7.5L10.5,4L9,5.5L12.5,9L4,17.5V20H6.5L15,11.5L18.5,15L20,13.5L16.5,10L21,3.5Z"/></svg>',
            part: '<svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/></svg>',
            leaf: '<svg viewBox="0 0 24 24"><path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8.15,20C13.5,20 18,15.5 18,10.15C18,9.43 17.56,8.68 17,8Z"/></svg>',
            flask: '<svg viewBox="0 0 24 24"><path d="M6,22L9,15H5L8,8H16L19,15H15L18,22H6Z"/></svg>',
            tray: '<svg viewBox="0 0 24 24"><path d="M4,6H20V18H4V6M2,4V20H22V4H2Z"/></svg>'
        };

        const recipes = {
            'ak47': {
                name: 'Assault Rifle', group: 'weapons', weight: '3.2 kg', slots: '1x3 slot', time: '30s', icon: icons.weapon,
                materials: [
                    { id: 'ak_tok', name: 'Assault Rifle tok', count: 1 },
                    { id: 'ak_rarszerkezet', name: 'Assault Rifle zárszerkezet', count: 1 },
                    { id: 'ak_tokfedel', name: 'Assault Rifle tokfedél', count: 1 },
                    { id: 'ak_valtamasz', name: 'Assault Rifle válltámasz', count: 1 },
                    { id: 'ak_elogy', name: 'Assault Rifle előgy', count: 1 },
                    { id: 'ak_pisztolymarkolat', name: 'Assault Rifle pisztolymarkolat', count: 1 },
                    { id: 'ak_tor', name: 'Assault Rifle tár', count: 1 }
                ],
                tools: [{ id: 'kalapocs', name: 'Kalapács', count: 1 }]
            },
            'pistol': {
                name: 'Pistol', group: 'weapons', weight: '0.96 kg', slots: '1x2 slot', time: '30s', icon: icons.weapon,
                materials: [
                    { id: 'pistol_test', name: 'Pistol test', count: 1 },
                    { id: 'pistol_csd', name: 'Pistol cső', count: 1 },
                    { id: 'pistol_szan', name: 'Pistol szán', count: 1 },
                    { id: 'pistol_markolat', name: 'Pistol markolat', count: 1 },
                    { id: 'pistol_tor', name: 'Pistol tár', count: 1 }
                ],
                tools: [{ id: 'kalapocs', name: 'Kalapács', count: 1 }]
            },
            'minismg': {
                name: 'Mini SMG', group: 'weapons', weight: '1.5 kg', slots: '1x2 slot', time: '30s', icon: icons.weapon,
                materials: [
                    { id: 'minismg_test_felso', name: 'Mini SMG test (felső)', count: 1 },
                    { id: 'minismg_test_also', name: 'Mini SMG test (alsó)', count: 1 },
                    { id: 'minismg_valtamasz', name: 'Mini SMG válltámasz', count: 1 },
                    { id: 'minismg_pisztolymarkolat', name: 'Mini SMG pisztolymarkolat', count: 1 },
                    { id: 'minismg_tor', name: 'Mini SMG tár', count: 1 }
                ],
                tools: [{ id: 'kalapocs', name: 'Kalapács', count: 1 }]
            },
            'lefureszelt': {
                name: 'Lefűrészelt csövű', group: 'weapons', weight: '2.38 kg', slots: '1x3 slot', time: '30s', icon: icons.weapon,
                materials: [
                    { id: 'lefureszelt_test', name: 'Lefűrészelt csövű test', count: 1 },
                    { id: 'lefureszelt_cso', name: 'Lefűrészelt csövű cső', count: 1 },
                    { id: 'lefureszelt_csotar', name: 'Lefűrészelt csövű csőtár', count: 1 },
                    { id: 'lefureszelt_elogy', name: 'Lefűrészelt csövű előgy', count: 1 },
                    { id: 'lefureszelt_markolat', name: 'Pistol markolat', count: 1 }
                ],
                tools: [{ id: 'kalapocs', name: 'Kalapács', count: 1 }]
            },
            'kokain': {
                name: 'Kokain (50g)', group: 'drugs', weight: '50 g', slots: '1x1 slot', time: '30s', icon: icons.drug,
                materials: [
                    { id: 'kokacserje', name: 'Kokacserje levél', count: 300, quickAdd: 300 },
                    { id: 'hidrogen_peroxid', name: 'Hidrogén-Peroxid', count: 1 },
                    { id: 'sebbenzin', name: 'Sebbenzin', count: 1 },
                    { id: 'ures_zacsko', name: 'Üres zacskó (M)', count: 1 }
                ],
                tools: [{ id: 'lombik', name: 'Lombik', count: 1 }, { id: 'talca', name: 'Tálca', count: 1 }]
            },
            'marihuana': {
                name: 'Marihuána (50g)', group: 'drugs', weight: '50 g', slots: '1x1 slot', time: '30s', icon: icons.drug,
                materials: [
                    { id: 'kannabisz_bibe', name: 'Kannabisz bibe', count: 180, quickAdd: 180 },
                    { id: 'ures_zacsko', name: 'Üres zacskó (M)', count: 1 }
                ],
                tools: [{ id: 'uv_lampa', name: 'UV lámpa', count: 1 }, { id: 'talca', name: 'Tálca', count: 1 }]
            },
            'meth': {
                name: 'Meth (50g)', group: 'drugs', weight: '50 g', slots: '1x1 slot', time: '30s', icon: icons.drug,
                materials: [
                    { id: 'pszeudoefedrin', name: 'Pszeudoefedrin', count: 20, quickAdd: 20 },
                    { id: 'hidrogen_peroxid', name: 'Hidrogén-Peroxid', count: 1 },
                    { id: 'aceton', name: 'Aceton', count: 1 },
                    { id: 'ures_zacsko', name: 'Üres zacskó (M)', count: 1 }
                ],
                tools: [{ id: 'lombik', name: 'Lombik', count: 1 }, { id: 'talca', name: 'Tálca', count: 1 }]
            },
            'c4': {
                name: 'C4 robbanótöltet', group: 'weapons', weight: '0.75 kg', slots: '1x2 slot', time: '10s', icon: icons.weapon,
                materials: [
                    { id: 'c4_robbanonyag', name: 'C4 robbanóanyag', count: 1 },
                    { id: 'mikrokontroller', name: 'Mikrokontroller', count: 1 }
                ],
                tools: [{ id: 'szigeteloszalag', name: 'Szigetelőszalag', count: 1 }, { id: 'csavarhuzo', name: 'Csavarhúzó', count: 1 }]
            }
        };

        let inventory = JSON.parse(localStorage.getItem('seerpg_inventory_all')) || {};
        let activeRecipeId = 'ak47';

        function saveInventory() {
            localStorage.setItem('seerpg_inventory_all', JSON.stringify(inventory));
            renderRecipe();
            renderCraftableList();
        }

        function getItemCount(id) { return inventory[id] || 0; }
        function setItemCount(id, val) { inventory[id] = Math.max(0, parseInt(val) || 0); saveInventory(); }
        function changeCount(id, amount) { inventory[id] = Math.max(0, getItemCount(id) + amount); saveInventory(); }

        function craftItem(recipeId) {
            const recipe = recipes[recipeId];
            let canCraft = true;
            [...recipe.materials, ...recipe.tools].forEach(item => { if (getItemCount(item.id) < item.count) canCraft = false; });
            if (!canCraft) return;
            recipe.materials.forEach(item => { inventory[item.id] = Math.max(0, getItemCount(item.id) - item.count); });
            saveInventory();
        }

        function renderNav() {
            const navWeapons = document.getElementById('nav-weapons');
            const navDrugs = document.getElementById('nav-drugs');
            navWeapons.innerHTML = ''; navDrugs.innerHTML = '';

            Object.keys(recipes).forEach(key => {
                const rec = recipes[key];
                const btn = document.createElement('button');
                btn.className = `nav-item ${key === activeRecipeId ? 'active' : ''}`;
                btn.innerHTML = `${rec.icon} <span>${rec.name}</span>`;
                btn.onclick = () => { activeRecipeId = key; renderNav(); renderRecipe(); };
                if (rec.group === 'weapons') navWeapons.appendChild(btn);
                else navDrugs.appendChild(btn);
            });
        }

        function renderRecipe() {
            const rec = recipes[activeRecipeId];
            const container = document.getElementById('recipe-view');
            let html = `
                <div class="recipe-header">
                    <div class="recipe-icon-large">${rec.icon}</div>
                    <div class="recipe-info">
                        <h2>${rec.name}</h2>
                        <div class="recipe-meta">
                            <span>⚖️ ${rec.weight}</span><span>📦 ${rec.slots}</span><span>⏱️ ${rec.time}</span>
                        </div>
                    </div>
                </div>
                <div class="section-title">A recepthez szükséges alapanyagok:</div>
                <div class="items-grid">
            `;

            rec.materials.forEach(mat => {
                const current = getItemCount(mat.id);
                let quickButtons = mat.quickAdd ? `
                    <div class="quick-add-bar">
                        <button class="quick-btn" onclick="changeCount('${mat.id}', ${mat.quickAdd})">+${mat.quickAdd}</button>
                        <button class="quick-btn" onclick="changeCount('${mat.id}', ${mat.quickAdd * 2})">+${mat.quickAdd * 2}</button>
                    </div>` : '';

                html += `
                    <div class="item-card">
                        <div class="item-icon">${mat.id.includes('levél') || mat.id.includes('bibe') ? icons.leaf : icons.part}</div>
                        <div class="item-name">${mat.name}</div>
                        <div class="item-req-count">Szükséges: ${mat.count}</div>
                        <div class="counter-controls">
                            <button class="counter-btn" onclick="changeCount('${mat.id}', -1)">-</button>
                            <input type="number" class="counter-input" value="${current}" onchange="setItemCount('${mat.id}', this.value)">
                            <button class="counter-btn" onclick="changeCount('${mat.id}', 1)">+</button>
                        </div>
                        ${quickButtons}
                    </div>
                `;
            });

            html += `</div><div class="section-title">A recepthez szükséges eszközök:</div><div class="items-grid">`;
            rec.tools.forEach(tool => {
                const current = getItemCount(tool.id);
                html += `
                    <div class="item-card">
                        <div class="item-icon">${tool.id.includes('lombik') ? icons.flask : (tool.id.includes('talca') ? icons.tray : icons.hammer)}</div>
                        <div class="item-name">${tool.name}</div>
                        <div class="item-req-count">Szükséges: ${tool.count}</div>
                        <div class="counter-controls">
                            <button class="counter-btn" onclick="changeCount('${tool.id}', -1)">-</button>
                            <input type="number" class="counter-input" value="${current}" onchange="setItemCount('${tool.id}', this.value)">
                            <button class="counter-btn" onclick="changeCount('${tool.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
            renderCraftableList();
        }

        function renderCraftableList() {
            const listContainer = document.getElementById('craftable-list');
            let html = '';
            Object.keys(recipes).forEach(key => {
                const rec = recipes[key];
                let maxCraftable = 999;
                [...rec.materials, ...rec.tools].forEach(item => {
                    const available = getItemCount(item.id);
                    const possible = Math.floor(available / item.count);
                    if (possible < maxCraftable) maxCraftable = possible;
                });
                if (maxCraftable === 999) maxCraftable = 0;
                const canCraft = maxCraftable > 0;

                html += `
                    <div class="craftable-row">
                        <div class="craftable-info">
                            ${rec.icon}
                            <span class="craftable-name">${rec.name}</span>
                        </div>
                        <div class="craft-action-group">
                            <span class="craftable-count">Elérhető: ${maxCraftable} db</span>
                            <button class="craft-btn" ${!canCraft ? 'disabled' : ''} onclick="craftItem('${key}')">Összeszerelés (-1)</button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        renderNav();
        renderRecipe();
    </script>
</body>
</html>
